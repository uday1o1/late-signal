name: CPU CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 3.12 verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          version: 0.11.23
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize the locked environment
        run: uv sync --frozen --all-groups

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          install_root="$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check --strict
          mkdir -p "$install_root"
          tar --extract --gzip --file "$archive" --directory "$install_root" actionlint
          "$install_root/actionlint"

      - name: Verify formatting
        run: uv run ruff format --check .

      - name: Run lint
        run: uv run ruff check .

      - name: Run strict typing
        run: uv run mypy

      - name: Run CPU tests
        run: uv run pytest

      - name: Audit release hygiene
        run: uv run latesignal audit --json
