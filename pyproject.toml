[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "latesignal"
version = "0.1.0"
description = "Leakage-audited event-time benchmark for delayed conversion learning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "LateSignal contributors" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "typer>=0.21.1,<0.22",
]

[project.scripts]
latesignal = "latesignal.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.0,<7",
  "mypy>=1.0,<2",
  "pytest>=8.0,<10",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/latesignal"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["latesignal"]
